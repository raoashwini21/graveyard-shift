<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graveyard Shift: a séance for your website</title>
<meta name="description" content="Hold a séance for your website. The spirits reveal dead links, possessed links, stale years and parties that already ended.">
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/fell-sc.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <button class="toggle" id="sound" aria-pressed="false">Sound off</button>
  <button class="toggle" id="boring" aria-pressed="false">Boring mode</button>
</header>

<main class="wrap">
  <section class="seance" id="seance">
    <p class="invite" id="invite">Ask the spirits what haunts your website.</p>

    <div class="table">
      <div class="candle" aria-hidden="true"></div>
      <div class="board" id="board" role="img" aria-label="A spirit board"></div>
      <div class="candle tall" aria-hidden="true"></div>
    </div>

    <form class="ask" id="ask">
      <label for="url">Whose house shall we visit tonight?</label>
      <div class="ask-row">
        <input id="url" name="url" placeholder="yoursite.com" autocomplete="url" inputmode="url" spellcheck="false" required>
        <button class="begin" type="submit">Begin the séance</button>
      </div>
      <div class="options">
        <label>Rooms to walk
          <select id="maxPages">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
          </select>
        </label>
        <label><input type="checkbox" id="external" checked> Knock on other sites' doors too</label>
      </div>
      <p class="error" id="error" role="alert"></p>
    </form>

    <div class="trance" id="trance" aria-live="polite">
      <p class="trance-line" id="tranceLine">The spirits are gathering…</p>
      <p class="trance-path" id="trancePath"></p>
      <p class="trance-count" id="tranceCount"></p>
      <button class="quiet-btn" id="cancel" type="button">End the séance</button>
    </div>

    <p class="spoken" id="spoken" aria-live="assertive"></p>
  </section>

  <section class="reading" id="reading" aria-labelledby="readingTitle">
    <div class="reading-head">
      <div>
        <h1 id="readingTitle"></h1>
        <p class="verdict" id="verdict"></p>
        <div class="actions">
          <button class="quiet-btn" id="again" type="button">New séance</button>
          <button class="quiet-btn" id="share" type="button">Download share card</button>
          <button class="quiet-btn" id="exportMd" type="button">Report</button>
          <button class="quiet-btn" id="exportCsv" type="button">CSV</button>
        </div>
      </div>
      <figure class="unrest" aria-labelledby="unrestCap">
        <div class="meter" id="meter"></div>
        <figcaption id="unrestCap"></figcaption>
      </figure>
    </div>

    <p class="hint" id="hint">Turn a card to see what it holds.</p>
    <div class="spread" id="spread"></div>
    <section class="card-reading" id="cardReading" aria-live="polite"></section>

    <div class="plain" id="plain"></div>
    <div class="limits" id="limits"></div>
  </section>
</main>

<div class="dark" id="dark" aria-hidden="true"></div>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
